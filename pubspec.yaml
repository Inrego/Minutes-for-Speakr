name: speakr_app
description: "Mobile and desktop client for self-hosted Speakr."
publish_to: "none"
version: 0.3.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  # State management
  flutter_riverpod: ^3.3.1

  # Networking
  dio: ^5.9.2

  # Routing
  go_router: ^17.2.2

  # Persistence
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.5

  # Audio
  just_audio: ^0.10.5
  just_audio_media_kit: ^2.1.0
  # No newer pub.dev release exists (1.0.9 from 2 years ago).
  # Pinned to upstream commit 7102e7d which lands the CMP0175 fix:
  # https://github.com/media-kit/media-kit/commit/7102e7d
  # Drop this override once a 1.0.10+ is published to pub.dev.
  media_kit_libs_windows_audio:
    git:
      url: https://github.com/media-kit/media-kit.git
      ref: 7102e7d
      path: libs/windows/media_kit_libs_windows_audio
  record: ^6.2.0

  # UI
  flutter_svg: ^2.2.4
  flutter_markdown_plus: ^1.0.7
  intl: ^0.20.2

  # Platform integration
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  # Reads the real build version/build-number at runtime (replaces the
  # hard-coded version string shown in Settings + the Windows window title).
  # Pinned at 9.x: package_info_plus 10.x requires win32 ^6.0.1, but win32 is
  # held at 5.x by file_picker's transitive constraint. 9.0.1 wants win32
  # ^5.5.3 which is compatible. Bump once file_picker relaxes win32 to 6.x.
  package_info_plus: ^9.0.1
  file_picker: ^11.0.2
  workmanager: ^0.9.0+3
  # In-repo Android Storage Access Framework bridge (packages/speakr_saf).
  # A plugin package rather than a MainActivity channel so it is also
  # registered in the WorkManager background engine. No external deps.
  speakr_saf:
    path: packages/speakr_saf
  # Multi-window (Windows-only feature: always-on-top mini recorder).
  # Pinned at 0.2.x: 0.3.0 is a "rewritten" release that swaps the
  # by-window-id IPC for a named-channel API (WindowMethodChannel,
  # different create/close semantics). Migration is its own task.
  desktop_multi_window: ^0.2.1
  # Pure-Dart FFI for Windows-only mic monitoring + output peak metering.
  # Selected via conditional imports; on non-Windows the stub paths are
  # used and these libs are loaded but never invoked. No CMake/native
  # build glue required (see lib/services/auto_record/).
  # win32 is pinned at 5.x by file_picker 11.0.2's transitive constraint
  # (win32 ^5.9.0). Bump to 6.x once file_picker relaxes that.
  win32: ^5.15.0
  ffi: ^2.2.0
  # win32_registry 3.x requires win32 ^6.0.0; 2.x is the highest we can
  # take while file_picker pins win32 to ^5.x.
  win32_registry: ^2.1.0

  # Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  # Utility
  collection: ^1.19.1
  path: ^1.9.1
  rxdart: ^0.28.0
  audio_metadata_reader: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.14.1
  freezed: ^3.2.5
  json_serializable: ^6.13.1

  # App icon generation (see tools/build_icon_sources.dart and the
  # flutter_launcher_icons config block below).
  image: ^4.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - openapi/speakr-openapi.json
    - speakr-mark-square.svg

  # Bundled OFL fonts. Registered per static weight/style so `fontWeight` /
  # `fontStyle` resolve to a real face instead of being synthesised. Only the
  # weights lib/theme/typography.dart and its call sites actually ask for are
  # shipped — see assets/fonts/README.md before adding one.
  fonts:
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4-Light.ttf
          weight: 300
        - asset: assets/fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: assets/fonts/SourceSerif4-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/SourceSerif4-Medium.ttf
          weight: 500
        - asset: assets/fonts/SourceSerif4-SemiBold.ttf
          weight: 600
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/InterTight-Regular.ttf
          weight: 400
        - asset: assets/fonts/InterTight-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/InterTight-Medium.ttf
          weight: 500
        - asset: assets/fonts/InterTight-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true

  ios: true

  android: "ic_launcher"
  adaptive_icon_background: "#FAFAF7"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

  # Windows icon is generated directly by tools/build_icon_sources.dart so
  # we can embed multiple sub-image sizes (16/24/32/48/64/128/256) — each
  # rendered fresh from the SVG primitives rather than downscaled from a
  # single source. flutter_launcher_icons would only embed one size.
